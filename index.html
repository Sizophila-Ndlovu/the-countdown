<!DOCTYPE html>
<html>
<head>
    <title>The Countdown to Mama's birthday</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>Yasho!</h1>
<button id="btn">PRESA</button>
<div class="howlongagogo-widget"
     data-date="2026-04-29"
     data-time="04:29:00"
     data-timezone="Africa/Johannesburg"
     data-name="The 43/37"
     data-bg-color="213b7a"
     data-title-color="ffffff"
     data-numbers-color="ffffff"
     data-labels-color="cccccc"
     data-show-date="true"
     data-date-format="F j, Y"
     data-font-family="space-grotesk"
     data-layout="compact"
     data-show-days="true"
     data-show-hours="true"
     data-show-minutes="true"
     data-show-seconds="true"
     data-border-radius="20"
     data-shadow="strong">
    <p>Countdown widget powered by <a href="https://howlongagogo.com">HowLongAgoGo.com</a></p>
</div>




<script async src="https://howlongagogo.com/js/widget.v3.js"></script>
<script>
    const btn = document.getElementById("btn");
    const title = document.querySelector("h1");

btn.addEventListener("click", function(){
    if (title.innerHTML === "Yeboo!"){
        title.innerHTML = "Yasho!";
    } else {
        title.innerHTML = "Yeboo!";
    }
});
    
   
</script>


</body>
</html>
